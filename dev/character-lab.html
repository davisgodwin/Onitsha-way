<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><style>body{margin:0;background:#e7e9ec;color:#23303b;font:16px Arial}canvas{display:block;width:100vw;height:100vh}#caption{position:absolute;top:24px;left:28px}h1{font-size:24px;margin:0 0 8px}p{margin:0;color:#4b5966}</style></head><body><div id="caption"><h1>Onitsha Way · Wardrobe</h1><p id="label">Character studio</p></div><script type="module">
import * as THREE from 'three';import{buildHuman,defaultAppearance,OUTFITS,HAIR_STYLES}from'/src/characters/HumanRig.js';import{CharacterAnimator}from'/src/characters/CharacterAnimator.js';
const renderer=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(1);renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.15;document.body.append(renderer.domElement);
const scene=new THREE.Scene();scene.background=new THREE.Color('#e7e9ec');const camera=new THREE.PerspectiveCamera(32,innerWidth/innerHeight,.05,30);camera.position.set(0,1.2,4.8);camera.lookAt(0,.95,0);scene.add(new THREE.HemisphereLight(0xe4efff,0x79695b,2.4));const key=new THREE.DirectionalLight(0xfff2e2,3);key.position.set(3,5,5);key.castShadow=true;key.shadow.mapSize.set(1024,1024);key.shadow.camera.left=-2;key.shadow.camera.right=2;key.shadow.camera.top=3;key.shadow.camera.bottom=-1;key.shadow.bias=-.0002;scene.add(key);const fill=new THREE.DirectionalLight(0xffffff,1.2);fill.position.set(-3,2,-2);scene.add(fill);const floor=new THREE.Mesh(new THREE.PlaneGeometry(30,30),new THREE.MeshStandardMaterial({color:0xd9dee3,roughness:.95}));floor.rotation.x=-Math.PI/2;floor.receiveShadow=true;scene.add(floor);
let humans=[];window.studio={OUTFITS,HAIR_STYLES,show(apps,pose='idle',close=false){for(const h of humans){scene.remove(h.group);h.dispose();}humans=apps.map((app,i)=>{const h=buildHuman({...defaultAppearance(app.gender),...app});h.group.position.x=(i-(apps.length-1)/2)*.65;h.group.rotation.y=-.12;scene.add(h.group);const a=new CharacterAnimator(h);if(pose==='seated')a.sit(.1);else{for(let k=0;k<16;k++)a.update(.05,{speed:pose==='run'?5.4:pose==='walk'?1.75:0,grounded:pose!=='jump',turnRate:0});}return h;});camera.aspect=innerWidth/innerHeight;camera.position.set(0,close?1.67:1.12,close?.73:apps.length>3?6.3:4.7);camera.lookAt(0,close?1.66:.94,0);camera.updateProjectionMatrix();document.querySelector('#label').textContent=apps.map(a=>`${a.gender} · ${a.outfit} · ${a.hair??''}`).join('  /  ');renderer.render(scene,camera);return humans.map(h=>({meshes:h.meshes.length,vertices:h.meshes.reduce((n,m)=>n+m.geometry.attributes.position.count,0),finite:h.meshes.every(m=>Array.from(m.geometry.attributes.position.array).every(Number.isFinite))}));},render(){renderer.render(scene,camera)},humans:()=>humans};window.studio.show([{gender:'male',outfit:'tee_chinos'}]);window.studio.audit=()=>{const problems=[];let vertices=0;scene.updateMatrixWorld(true);for(const h of humans)for(const m of h.meshes){m.skeleton.update();const g=m.geometry,p=g.attributes.position,wi=g.attributes.skinIndex,ww=g.attributes.skinWeight;vertices+=p.count;for(let i=0;i<p.count;i++){const sum=ww.getX(i)+ww.getY(i)+ww.getZ(i)+ww.getW(i);if(!Number.isFinite(sum)||Math.abs(sum-1)>.0001)problems.push('weights');for(let k=0;k<4;k++)if(wi.array[i*4+k]>=h.skeleton.bones.length)problems.push('bone index');if(i%97===0){const v=new THREE.Vector3().fromBufferAttribute(p,i);m.applyBoneTransform(i,v);if(![v.x,v.y,v.z].every(Number.isFinite)||Math.abs(v.x)>3||Math.abs(v.y)>3||Math.abs(v.z)>3)problems.push('posed vertex');}}}return{vertices,problems};};window.ready=true;
</script></body></html>
