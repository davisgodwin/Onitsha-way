<!doctype html><html><head><meta charset="utf-8"><title>Character test</title>
<style>body{margin:0;background:#888}canvas{display:block}</style></head><body>
<script type="module">
import * as THREE from 'three';
import { buildHuman, OUTFITS, HAIR_STYLES } from '../src/characters/HumanRig.js';
import { CharacterAnimator } from '../src/characters/CharacterAnimator.js';
const q = new URLSearchParams(location.search);
const r = new THREE.WebGLRenderer({antialias:true}); r.setSize(1400,700); document.body.appendChild(r.domElement);
r.toneMapping = THREE.ACESFilmicToneMapping; r.outputColorSpace = THREE.SRGBColorSpace;
const s = new THREE.Scene(); s.background = new THREE.Color('#b9c4cc');
s.add(new THREE.HemisphereLight('#fff','#7a5a40',1.2)); const d=new THREE.DirectionalLight('#fff4e0',2.2); d.position.set(2,4,3); s.add(d);
const cam = new THREE.PerspectiveCamera(30, 2, 0.1, 50);
const close = q.get('close');
const list = [];
const configs = [];
for (const g of ['male','female']) for (let i=0;i<3;i++) configs.push({gender:g, skin:(i*2+ (g==='female'?1:0))%6, hair:HAIR_STYLES[g][i].id, outfit:OUTFITS[g][i].id, palette:i+ (g==='female'?2:0), color:i});
configs.forEach((c,i)=>{ const h=buildHuman(c); h.group.position.x=(i-2.5)*0.75; s.add(h.group); list.push({h, a:new CharacterAnimator(h)}); });
if (close) { cam.position.set((+close-2.5)*0.75, 1.62, 0.75); cam.lookAt((+close-2.5)*0.75,1.6,0); } else { cam.position.set(0,1.1,6.2); cam.lookAt(0,0.95,0); }
const speed = +(q.get('speed')||0); const rot = +(q.get('rot')||0);
list.forEach(o=>o.h.group.rotation.y = rot);
let t=+(q.get('t')||0.3);
for (let k=0;k<Math.round(t/0.016);k++) list.forEach(o=>o.a.update(0.016,{speed,grounded:true,turnRate:0}));
r.render(s,cam); window.__done=true;
</script></body></html>
